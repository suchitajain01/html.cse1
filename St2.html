<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Responsive Product Grid</title>
 <style>


 body {
 font-family: Arial;
 margin: 0;
 background: white;
 padding:50px;
 }


 h2 {
 text-align: center;
 margin-bottom: 90px;
 }


 
 .grid {
 display: grid;
 grid-template-columns: repeat(4, 1fr); 
 gap: 20px;
 }


 
 .card {
 background: white;
 border-radius: 8px;
 box-shadow: 0 4px 6px rgba(0,0,0,0.1);
 padding: 16px;
 text-align: center;
 }

 .card img{
 width:90%;
 height: 150px;
 object-fit: fill;
 margin-bottom: 10px;
 }


 .card h3 {
 font-size: 18px;
  }

 .card p {
 font-size: 14px;
 margin: 4px 0;
 }

 .price {
 font-weight: bold;
 }
 
 </style>
  
</head>

<body>
 <h2>Responsive Product Grid</h2>


<div class="grid">


 <div class="card">
 <img src= "User_Image1.jpeg; alt="Product 1">
 <h3>Wireless Headphones</h3>
 <p>High-quality item with great features.</p>
 <p class="price">₹2,999</p>
 </div>


 <div class="card">
 <img src="user_image2.jpeg" alt="Product 2">
 <h3>Rings</h3>
 <p>Durable and stylish for daily use.</p>
 <p class="price">₹599</p>
 </div>


 <div class="card">
 <img src="user_image3.jpeg " alt="Product 3">
 <h3>Trendy designer Sling bag</h3>
 <p>Luxurious and portable for daily use.</p>
 <p class="price">₹999</p>
 </div>



 <div class="card">
 <img src="user_image4.jpeg" alt = "Product 4">
 <h3> Trendy modern wear baggy jeans  </h3>
 <p> perfect wear for young womens.  </p>
 <p class="price">₹999</p>
 </div>


 </div>
</body>
