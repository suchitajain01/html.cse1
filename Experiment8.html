<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Flexbox Student Profile Card</title>
<style>

 body{
 font-family:Verdana, Geneva, Tahoma, sans-serif;
 margin: 20px;
 background: #ceaaaa;
 }

 h2{
    text-align:center;
}

 .container{
 display: flex; /* Flexbox container */
 flex-direction: row; /* Arrange in a row */
 justify-content: center; /* Center horizontally */
 align-items: center; /* Align vertically */
 gap: 50px; /* Space between cards */
 flex-wrap: wrap; /* Wrap to next line if needed */

 }

  .card{
 background: #997676;
 border-radius: 50px;
 box-shadow: 0 4px 6px rgba(85, 61, 173, 0.1);
 width: 220px;
 text-align: center;
 padding: 16px;
 }



 .avatar{
 width: 70px; height: 70px;
 background: #b64d4d; color: #fff;
 border-radius: 50%;
 display: flex; justify-content: center; align-items: center;
 font-size: 20px; margin: 0 auto 12px;
 }


 .name{ 
    font-weight: bold; font-size: 18px;
 }



 .detail{ 
    font-size: 14px; color: #000000; margin: 2px 0; 
}


 </style>


</head>
<body>
 <h2>Student Profile Cards</h2>
 <div class="container">
 <div class="card">
 <div class="avatar">SJ</div>
 <div class="name">Suchita Jain</div>
 <div class="detail">B.Tech - CSE</div>
 <div class="detail">Roll No: 25CS10111</div>
 <div class="detail">1st Year</div>
 </div>

 <div class="card">
 <div class="avatar">KK</div>
 <div class="name">Kushagare Khare</div>
 <div class="detail">B.Tech - ECE</div>
 <div class="detail">Roll No: 21ECE1992</div>
 <div class="detail">1st Year</div>
 </div>

 <div class="card">
 <div class="avatar">VK</div>
 <div class="name">Vaibhav Kumar</div>
 <div class="detail">B.Tech - AIML</div>
 <div class="detail">Roll No: 24AI1009</div>
 <div class="detail">2st Year</div>
 </div>
 </div>
</body>
</html>
